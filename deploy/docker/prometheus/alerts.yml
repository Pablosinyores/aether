groups:
  - name: aether.rules
    interval: 30s
    rules:

      # NOTE: `== 3` is the integer encoding for the Halted state defined in
      # cmd/executor/main.go:stateToInt. Keep in sync with that mapping and
      # internal/risk/state.go's State* constants — see the SYNC SOURCE
      # comments at both sites.
      - alert: AetherHalted
        expr: aether_system_state == 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aether system is Halted"
          description: "System state gauge reports Halted (3) for >1m. Halted requires manual reset. Check executor logs for the breaker reason."

      - alert: AetherInclusionRateLow
        expr: |
          sum(rate(aether_executor_bundles_included_total[1h]))
          /
          clamp_min(sum(rate(aether_executor_bundles_submitted_total[1h])), 1e-9) < 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Bundle inclusion rate below 20% over the last hour"
          description: "Over the last 1h, fewer than 20% of submitted bundles were included. Current ratio: {{ printf \"%.2f\" $value }}."

      - alert: AetherE2ELatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(aether_end_to_end_latency_ms_bucket[5m]))) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "End-to-end p99 latency above 100ms"
          description: "p99 end-to-end latency = {{ printf \"%.1f\" $value }}ms over last 5m (target <100ms)."

      - alert: AetherNoOpportunities
        # Suppress during the first 30m after process start so a fresh boot or
        # restart does not page operators while the warm-up window is still
        # building up the publish-rate window.
        expr: |
          (rate(aether_arbs_published_total[10m]) * 60 < 5)
          unless on() (
            (time() - min(process_start_time_seconds{job="aether-rust"})) < 1800
          )
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Fewer than 5 opportunities per minute"
          description: "Arb publish rate = {{ printf \"%.1f\" $value }}/min over last 10m. Detection pipeline may be stalled."

      - alert: AetherETHBalanceLow
        expr: aether_eth_balance < 0.15
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Searcher ETH balance below 0.15"
          description: "Hot wallet ETH balance = {{ printf \"%.4f\" $value }}. Top up before bundles start reverting on gas."

      - alert: AetherGasHigh
        expr: aether_gas_price_gwei > 300
        for: 30s
        labels:
          severity: info
        annotations:
          summary: "Gas price above 300 gwei"
          description: "Base fee = {{ printf \"%.1f\" $value }} gwei. Executor preflight will reject arbs until this drops."

      - alert: AetherBuilderDown
        # Disabled builders register zero-total on both {success} and {failure}
        # series, so the second leg below filters them out by requiring
        # observed traffic. Operators staring at an "idle" disabled builder
        # see no alert by design — that's expected, not a regression.
        expr: |
          sum by (builder) (rate(aether_executor_builder_submissions_total{result="success"}[2m])) == 0
          and on (builder)
          sum by (builder) (rate(aether_executor_builder_submissions_total[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Builder {{ $labels.builder }} has no successful submissions"
          description: "Builder {{ $labels.builder }} received submissions but zero succeeded over the last 2m. Check builder endpoint health and auth. Note: builders configured with Enabled=false are intentionally silent here."

      # Self-monitor of the alerting path. If Alertmanager crashloops (bad
      # config, SLACK_WEBHOOK_URL missing, etc.) the rest of the alerts above
      # silently never reach Slack; this rule fires through Prometheus's own
      # built-in alert delivery so the gap surfaces.
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager scrape target is down"
          description: "Prometheus has been unable to scrape alertmanager:9093 for 2m. Slack delivery is offline. Check the alertmanager container logs and SLACK_WEBHOOK_URL config."

  # Unattended-run health for the public-mempool shadow soak (Arm A). These
  # watch the observability pipeline (predictions -> reconciliation ->
  # profitability) rather than the execution path, so they apply whether or
  # not the executor/backrun validator is running.
  - name: aether.shadow.rules
    interval: 30s
    rules:

      # Fires only for a target that was scraped within the last hour and is
      # now down — so a never-deployed target (wrong compose profile, or the
      # executor in an Arm-A run) is silent by design, while a producer that
      # actually died (or crash-loops past spawn_with_restart's backoff) pages.
      - alert: AetherProducerDown
        expr: |
          up{job=~"aether-rust|aether-go|aether-host-rust|aether-host-reconciler|aether-host-scorer|aether-host-monitor"} == 0
          and on(job, instance)
          max_over_time(up{job=~"aether-rust|aether-go|aether-host-rust|aether-host-reconciler|aether-host-scorer|aether-host-monitor"}[1h]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Aether producer {{ $labels.job }} is down"
          description: "Prometheus could not scrape {{ $labels.job }} ({{ $labels.instance }}) for >2m after previously being up. A supervised process is down or crash-looping past its restart window — grep its log for an '[ALERT] crash-looping' line."

      # Catches a silently-dead mempool WS subscription that does NOT crash the
      # engine (so AetherProducerDown stays quiet): predictions simply stop
      # being written. The 15m window + 15m `for` already gives ~30m of grace,
      # and the boot suppression is belt-and-suspenders (no-op if the rust
      # client does not export process_start_time_seconds).
      - alert: MempoolPredictionsStalled
        expr: |
          sum(rate(aether_mempool_predictions_persisted_total[15m])) == 0
          unless on() (
            (time() - min(process_start_time_seconds{job=~"aether-rust|aether-host-rust"})) < 1800
          )
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No mempool predictions persisted in 15m"
          description: "aether_mempool_predictions_persisted_total has been flat for 15m while the engine is up — likely a dead WS subscription or a dropped MEMPOOL_LEDGER_DSN. The Arm-A headline ledger is not filling."

      # PruneMempoolLedger errors usually mean Postgres connectivity/permission
      # trouble; left unattended the predictions ledger then grows unbounded.
      - alert: MempoolRetentionErrors
        expr: increase(aether_mempool_retention_errors_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mempool retention sweep is failing"
          description: "PruneMempoolLedger errored {{ $value }} time(s) in 15m. The predictions ledger may grow unbounded; check Postgres reachability and the reconciler logs."

      # Reconciliation writer channel saturated (or Postgres slow) — coverage
      # gaps in the reconciliation table follow.
      - alert: MempoolReconcilerDrops
        expr: increase(aether_mempool_reconciler_drops_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reconciler is dropping writes"
          description: "{{ $value }} reconciliation row(s) dropped in 10m — the writer channel saturated or Postgres is slow. Reconciliation coverage will have gaps."
